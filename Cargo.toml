[workspace]
resolver = "3"
members = [
    "crates/repox-core",
    "crates/repox-tui",
]

[workspace.package]
version = "0.3.3"
edition = "2024"
authors = ["WVDYC <altemirzhilkibayev@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/WVDYC/repOx"
description = "High-performance CLI & TUI to pack repositories into LLM context prompts in milliseconds"
readme = "README.md"
keywords = ["cli", "tui", "llm", "prompt", "packer"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
repox-core = { path = "crates/repox-core", version = "0.3.3" }
repox-tui = { path = "crates/repox-tui", version = "0.3.3" }

# CLI & Terminal
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
clap_complete = "4.5"
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arboard = "3.4"
ratatui = "0.30"
crossterm = "0.29"
nucleo-matcher = "0.3"

# Filesystem & Concurrency
ignore = "0.4"
globset = "0.4"
rayon = "1.10"

# Tokenization
tiktoken-rs = "0.6"

# Error Handling & Utilities
thiserror = "2.0"
tempfile = "3.17"

[package]
name = "repox-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
repox-core.workspace = true
repox-tui.workspace = true
clap.workspace = true
clap_complete.workspace = true
color-eyre.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
arboard.workspace = true
rayon.workspace = true

[[bin]]
name = "repox"
path = "src/main.rs"
